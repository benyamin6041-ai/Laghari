name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            tk-dev \
            libgdbm-dev \
            libc6-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses5-dev \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ant \
            android-sdk-platform-tools \
            android-sdk-build-tools

      - name: Fix Aidl Path for Buildozer
        run: |
          # ساخت پوشه مورد نیاز Buildozer
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools
          
          # پیدا کردن مسیر واقعی aidl در سیستم و لینک کردن آن به پوشه buildozer
          AIDL_PATH=$(which aidl || find /usr/lib/android-sdk/build-tools -name aidl | head -n 1)
          if [ -z "$AIDL_PATH" ]; then
             echo "Aidl not found in system, trying fallback..."
             # اگر پیدا نشد، از مسیر پیش‌فرض اوبونتو استفاده می‌کنیم
             AIDL_PATH="/usr/lib/android-sdk/build-tools/34.0.0/aidl" 
          fi
          
          echo "Linking $AIDL_PATH to Buildozer directory"
          # ایجاد لینک برای اطمینان از اینکه Buildozer آن را می‌بیند
          sudo ln -sf $(which aidl) /usr/bin/aidl
          
          # ایجاد پوشه برای ابزارهای ساخت در مسیری که Buildozer انتظار دارد
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0
          cp $(which aidl) $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/

      - name: Install Buildozer dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython requests urllib3 certifi

      - name: Build with Buildozer
        run: |
          # استفاده از دستور build برای اجبار به استفاده از تنظیمات جدید
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
