name: Build Android App (Forced Fix)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            tk-dev \
            libgdbm-dev \
            libc6-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses5-dev \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ant \
            android-sdk-build-tools

      - name: Force Create Buildozer Directories and Aidl
        run: |
          # ۱. ساختن مسیر دقیق و سخت‌گیرانه‌ای که Buildozer در ارور می‌گوید وجود ندارد
          TARGET_DIR="$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0"
          echo "Creating directory: $TARGET_DIR"
          mkdir -p "$TARGET_DIR"

          # ۲. پیدا کردن فایل aidl واقعی در سیستم گیت‌هاب
          # معمولاً در مسیر /usr/lib/android-sdk/build-tools/ یا مشابه آن است
          REAL_AIDL=$(find /usr -name aidl -type f | head -n 1)

          if [ -z "$REAL_AIDL" ]; then
            echo "CRITICAL ERROR: No aidl found on the system at all!"
            exit 1
          else
            echo "Found real aidl at: $REAL_AIDL"
            # ۳. کپی کردن فایل aidl به داخل پوشه مورد نظر Buildozer
            cp "$REAL_AIDL" "$TARGET_DIR/aidl"
            echo "Successfully copied aidl to $TARGET_DIR/aidl"
          fi

          # ۴. ساخت یک لینک نمادین (Symbolic Link) برای اطمینان بیشتر
          sudo ln -sf $(which aidl) /usr/bin/aidl || true

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        run: |
          # استفاده از فلگ برای اجبار به استفاده از تنظیمات موجود
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
