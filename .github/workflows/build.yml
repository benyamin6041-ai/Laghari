name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            tk-dev \
            libgdbm-dev \
            libc6-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses5-dev \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ant \
            android-sdk-platform-tools \
            android-sdk-build-tools

      - name: Fix Aidl Path for Buildozer
        run: |
          # پیدا کردن مسیر دقیق aidl در سیستم
          AIDL_BIN=$(which aidl)
          
          if [ -z "$AIDL_BIN" ]; then
            echo "Error: aidl not found in system path"
            exit 1
          fi

          echo "Found aidl at: $AIDL_BIN"

          # ساخت ساختار پوشه‌بندی دقیق Buildozer
          # ما مستقیماً فایل را در پوشه build-tools کپی می‌کنیم
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
          
          # کپی کردن فایل aidl به پوشه هدف
          cp "$AIDL_BIN" "$HOME/.buildozer/android/platform/android-sdk/build-tools/34.0.0/"
          
          echo "Successfully copied aidl to Buildozer directory"

      - name: Install Buildozer dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython requests urllib3 certifi

      - name: Build with Buildozer
        run: |
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
