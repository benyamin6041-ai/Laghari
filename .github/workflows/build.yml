name: Build Android App (Final Attempt)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            libncurses5-dev \
            libncursesw5-dev \
            zlib1g-dev \
            cmake \
            autoconf \
            automake \
            libtool \
            pkg-config \
            unzip \
            zip

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        run: |
          # این دستور بسیار حیاتی است: 
          # ما از --use-sdk و --use-ndk استفاده نمی‌کنیم، 
          # بلکه اجازه می‌دهیم buildozer در محیط ایزوله خودش بیلد کند 
          # اما با استفاده از یک متغیر محیطی که محدودیت‌ها را کم می‌کند.
          export BUILD_VERSION=1
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-debug
          path: bin/*.apk
