name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            tk-dev \
            libgdbm-dev \
            libc6-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses5-dev \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ant \
            android-sdk \
            android-sdk-platform-tools \
            android-sdk-build-tools

      - name: Install Buildozer dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer cython requests urllib3 certifi

      - name: Build with Buildozer
        run: |
          # این دستور باعث می‌شود buildozer شروع به کار کند
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug
          path: bin/*.apk
