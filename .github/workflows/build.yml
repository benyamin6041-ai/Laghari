name: Build Android App (Docker Method)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer in Docker
        uses: kivy/buildozer-action@v1
        with:
          # این اکشن از یک محیط آماده (Docker) استفاده می‌کند که تمام ابزارهای 
          # Android SDK, NDK و Aidl را از قبل در خود دارد.
          # بنابراین دیگر با خطای "Aidl not found" یا "sdkmanager missing" مواجه نمی‌شویم.
          buildozer_args: debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: bin/*.apk
