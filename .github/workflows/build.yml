    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            git \
            python3-dev \
            python3-pip \
            libffi-dev \
            libssl-dev \
            libbz2-dev \
            libreadline-dev \
            libsqlite3-dev \
            tk-dev \
            libgdbm-dev \
            libc6-dev \
            libbz2-dev \
            libexpat1-dev \
            zlib1g-dev \
            libncurses5-dev \
            libgdbm-dev \
            libsqlite3-dev \
            libssl-dev \
            libreadline-dev \
            libffi-dev \
            wget \
            curl \
            unzip \
            zip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            cmake \
            ant \
            android-sdk \
            android-sdk-platform-tools \
            android-sdk-build-tools
          
          # این خط بسیار مهم است برای رفع خطای Aidl
          sudo apt-get install -y android-sdk-platform-tools android-sdk-build-tools
