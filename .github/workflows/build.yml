name: Build Android App

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          # نصب پکیج‌های سیستم عامل و کتابخانه‌های مورد نیاز Kivy
          sudo apt-get install -y python3-pip git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo-dev cmake libffi-dev libssl-dev
          
          # نصب ابزارهای اندروید برای رفع خطای Aidl
          sudo apt-get install -y android-sdk
          
          # ایجاد لینک میانبر برای رفع مشکل شناسایی نشدن aidl توسط Buildozer
          # این بخش حیاتی‌ترین قسمت برای حل مشکل شماست
          sudo ln -s /usr/lib/android-sdk/tools/bin/aidl /usr/bin/aidl || true

      - name: Install Buildozer and Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Build with Buildozer
        run: |
          # اجرای عملیات بیلد
          # استفاده از -v برای دیدن جزئیات دقیق در کنسول گیت‌هاب
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-app-apk
          path: bin/*.apk
